apply plugin: 'com.android.application'

android {
    namespace 'com.psiconnect.appexercicio'
    compileSdk 34

    defaultConfig {
        applicationId "com.psiconnect.appexercicio"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
